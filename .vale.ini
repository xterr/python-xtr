# Checks the documentation against the ASD-STE100 writing rules a tool can check.
# Run from the repository root: `uv run --only-group docs vale docs`.
# The rules themselves are described in docs/AGENTS.md.
StylesPath = docs/.vale/styles
MinAlertLevel = warning
Vocab = xtr

[*.md]
BasedOnStyles = Vale, STE

# Each page in setup/ and guides/ is a procedure: 20 words in a sentence, not 25.
[docs/{setup,guides}/*.md]
BasedOnStyles = Vale, STE, STEProcedure
STE.SentenceLength = NO

# The writing rules quote the words they forbid.
[docs/AGENTS.md]
BasedOnStyles =
