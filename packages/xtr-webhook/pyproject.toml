[project]
name = "xtr-webhook"
version = "4.0.3"
description = "Receive webhooks — verified, replay-bounded, turned into events — and send them signed, in the legacy or the Standard Webhooks format."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["webhook", "standard-webhooks", "signature", "hmac", "remote-event", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4",
    "msgspec>=0.18",
    "xtr-clock>=4.0,<5",
    # The client interface a webhook is sent through; the client is the `client` extra.
    "xtr-http-client-contracts>=4.0,<5",
    # The matchers a parser says which requests are its sender's with.
    "xtr-http-foundation>=4.0,<5",
    "xtr-http-message-contracts>=4.0,<5",
    "xtr-messenger>=4.0,<5",
    "xtr-remote-event>=4.0,<5",
    "xtr-service-contracts>=4.0,<5",
    # The endpoint webhooks arrive at, contributed to the application's routes.
    "xtr-http-kernel>=4.0,<5",
    "fastapi>=0.121.3",
]

[project.optional-dependencies]
# The HTTP client webhooks are sent through, its private-network guard, and its bundle.
client = [
    "xtr-http-client>=4.0,<5",
]
di = [
    "xtr-dependency-injection>=4.0,<5",
]
# What xtr_webhook.testing builds its requests with.
testing = [
    "xtr-http-message>=4.0,<5",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
webhook = "xtr_webhook.bundle:WebhookBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
webhook = "xtr_webhook.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "fastapi>=0.121.3",
    # The tests drive the endpoint over an in-process transport of their own.
    "httpx>=0.27",
    "xtr-dependency-injection>=4.0,<5",
    "xtr-http-client>=4.0,<5",
    "xtr-http-kernel>=4.0,<5",
    "xtr-http-message>=4.0,<5",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_webhook/exception/.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the engine reads at
# runtime; deferring these would register the factories under nothing.
"src/xtr_webhook/bundle/*.py" = ["TC001", "TC002", "TC003"]
"src/xtr_webhook/routes.py" = ["A002"] # FastAPI binds the {type} path segment by argument name
# A container builds the handler from its constructor's annotation, which it
# reads at runtime; deferring it would leave the transport unresolvable.
"src/xtr_webhook/messenger/send_webhook_handler.py" = ["TC001"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
    "S105",    # fake secret literals are test data
    "S106",    # fake secret literals are test data
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Message dataclasses are read field by field at runtime, so the imports their
# annotations name must stay out of TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
