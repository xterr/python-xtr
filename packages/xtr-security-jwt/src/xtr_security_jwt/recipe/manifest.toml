# The recipe for xtr-security-jwt: what *Use in an application* in the README
# takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
# An add-on: no other bundle requires it, so it only ever arrives by being
# listed. It brings the security, clock and event dispatcher bundles with it.
"xtr_security_jwt.bundle:JwtBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle builds and boots without it, but signs nothing until a key is
# named: this module points secret_key at the file JWT_SECRET_KEY_PATH names.
"config/packages/jwt.py" = "files/config/jwt.py.tmpl"

[env]
# The file the written configuration reads the signing key from: the key the
# [keys] table below mints, at the same path — where
# `jwt:generate-keypair --kid jwt --output-dir secrets` writes one too. A
# deployment mounts its own key and points this at it.
JWT_SECRET_KEY_PATH = "%kernel.project_dir%/secrets/jwt.pem"
# What the minted key is encrypted with, made up once for this project. Left
# with no default when a key is already in place, since a fresh secret would not
# open it.
JWT_PASSPHRASE = "%generate(secret)%"

[keys]
# Minted under the project root when no file is there yet, never replaced, and
# never deleted with the package — nor minted when JWT_SECRET_KEY_PATH already
# points at a key of the project's own. Named jwt.pem, so its key id is "jwt",
# as the keypair command's `--kid jwt` names it.
"secrets/jwt.pem" = { algorithm = "RS256", passphrase = "JWT_PASSPHRASE", path_env = "JWT_SECRET_KEY_PATH" }

[gitignore]
# A private key never enters the repository, wherever the keypair command puts
# it; nor does the public JWK set the same command writes beside it.
lines = ["/secrets/*.pem", "/secrets/*.jwks.json"]

[notes]
steps = [
  "Build the kernel with concurrent_scoped_access=True and call setup(app, kernel) where the application is served, as the security family requires.",
  "The signing key was minted at secrets/jwt.pem, encrypted with JWT_PASSPHRASE. The key is ignored, so another checkout mints its own with 'uv run xtr-recipes recipes:install xtr-security-jwt', which encrypts it with the JWT_PASSPHRASE in its .env. In production, set JWT_SECRET_KEY_PATH and JWT_PASSPHRASE to the deployment's own key rather than the development values in .env.",
  "Add JwtAuthenticatorConfig() to a firewall's authenticators in config/packages/security.py: nothing reads a token until a firewall does.",
]
check = [
  "<script> debug:bundles — jwt is listed and active, security required",
  "<script> debug:firewall <name> — the firewall's jwt authenticator",
  "<script> jwt:check-config — the configured key is there, and signs and verifies",
]
