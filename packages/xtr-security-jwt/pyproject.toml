[project]
name = "xtr-security-jwt"
version = "2.0.0"
description = "Self-issued JSON Web Tokens for xtr security: key sets, an encoder and a token manager for a user."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["security", "jwt", "jose", "authentication", "token"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "xtr-security-core>=2.0,<3",
    "xtr-security-http>=2.0,<3",
    "joserfc>=1.7",
    "xtr-clock>=2.0,<3",
    "xtr-event-dispatcher-contracts>=2.0,<3",
    "xtr-event-dispatcher>=2.0,<3",
    "typing-extensions>=4.12",
    "xtr-dependency-injection>=2.0,<3",
    "xtr-security>=2.0,<3",
]

[project.optional-dependencies]
console = [
    "xtr-console>=2.0,<3",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
jwt = "xtr_security_jwt.bundle:JwtBundle"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "httpx>=0.27",
    "fastapi>=0.123",
    "xtr-http-kernel>=2.0,<3",
    "xtr-console>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# Tests reach into what a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests; the extra path lets them import the support package.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002",
    # Errors compose their message from typed fields; the string at a raise site is a reason.
    "TRY003", "EM101", "EM102",
    # The package logs through the logging contract, whose context mapping
    # the standard library's format-argument checks misread:
    "PLE1205", "PLE1206",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests carry key material as literals (S105/S106), annotate doubles loosely
# (ANN), and — in the served fixtures and command tests — keep the container-read
# annotations importable at runtime (TC001/TC002), the way the library does.
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "ARG",
    "PLR2004",
    "PLR0913",
    "SLF001",
    "D",
    "TC001",
    "TC002",
    "ANN001",
    "ANN202",
    "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
