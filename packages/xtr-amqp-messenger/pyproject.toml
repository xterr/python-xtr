[project]
name = "xtr-amqp-messenger"
version = "6.4.0"
description = "A RabbitMQ transport for xtr-messenger: queues on an AMQP broker, a retry ladder, delays and real dead-lettering, through taskiq."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["message-bus", "message-queue", "transport", "amqp", "rabbitmq", "taskiq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aio-pika>=9.4",
    "anyio>=4.0",
    "taskiq>=0.12.4",
    "taskiq-aio-pika>=0.6.0",
    "typing-extensions>=4.4",
    # The broker-agnostic taskiq bridge this transport builds on lives in the message bus.
    "xtr-messenger>=6.0,<7",
]

# Found by the message bus when a DSN's scheme is amqp or amqps, with no wiring:
# the factory needs only the envelope serializer, which discovery hands over.
[project.entry-points."xtr_messenger.transport_factories"]
amqp = "xtr_amqp_messenger.transport:AmqpTransportFactory"
amqps = "xtr_amqp_messenger.transport:AmqpTransportFactory"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
amqp = "xtr_amqp_messenger.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ty>=0.0.83",
    # The envelope serializer the tests encode with is built on it, as the messenger's is.
    "xtr-serializer>=6.0,<7",
    # Read the shipped recipe with the parser recipes:sync uses.
    "xtr-recipes>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# taskiq exposes no public accessor for a broker's declared queues.
# declared_queues() wraps that gap in one place so nothing else has to.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_amqp_messenger/transport/amqp_broker.py"
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field.
    "TRY003",
    "EM101",
    "EM102",
    # The logging contract's LoggerInterface takes a context mapping, not the standard
    # library's format arguments; PLE1205 reads one as the other.
    "PLE1205",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "S603",    # a fresh interpreter is the only way to assert a module was never imported
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Without this, isort classifies the broker libraries as first-party.
[tool.ruff.lint.isort]
known-third-party = ["taskiq", "taskiq_aio_pika", "aio_pika"]

# Message dataclasses are introspected at runtime (get_type_hints), so their
# field imports must stay out of TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
