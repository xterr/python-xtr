[project]
name = "xtr-security-oauth2-server"
version = "5.0.1"
description = "An OAuth 2.0 authorization server and resource-server authenticator for xtr security."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["security", "oauth2", "authorization-server", "resource-server", "authentication", "token"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "xtr-security-oauth2-server-core>=5.0,<6",
    "xtr-security-core>=5.0,<6",
    "xtr-security-http>=5.0,<6",
    "xtr-security>=5.0,<6",
    "xtr-security-jwt>=5.0,<6",
    "xtr-password-hasher>=5.0,<6",
    "xtr-clock>=5.0,<6",
    "xtr-event-dispatcher-contracts>=5.0,<6",
    "xtr-event-dispatcher>=5.0,<6",
    # The authorization endpoint reports a request that arrived with no
    # resource owner where the deployment can read it; the contract is all it
    # needs, and a deployment that logs nothing is left alone.
    "xtr-logging-contracts>=5.0,<6",
    "xtr-dependency-injection>=5.0,<6",
    "xtr-http-message-contracts>=5.0,<6",
    # The endpoints are typed with the kernel's own response — the object an
    # application's container hands them is both an HTTP message and a response
    # the framework can send — and the authenticator turns the request being
    # served into a message through the kernel's bridge.
    "xtr-http-kernel>=5.0,<6",
    # The endpoints are framework routes, contributed to the application's table.
    "fastapi>=0.123",
    "joserfc>=1.7",
    "typing-extensions>=4.12",
    "anyio>=4.0",
    # The token, authorize, device-code and revoke endpoints read a form body,
    # which the web framework parses only when this is installed.
    "python-multipart>=0.0.9",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
oauth2_server = "xtr_security_oauth2_server.bundle:OAuth2ServerBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
oauth2_server = "xtr_security_oauth2_server.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ty>=0.0.83",
    "httpx>=0.27",
    # The library speaks the message contracts; the tests need messages to hand
    # it, which is what the implementation is for.
    "xtr-http-message>=5.0,<6",
    "xtr-console>=5.0,<6",
    "xtr-orm>=5.0,<6",
    # The stored managers are tested against a real database: a SQLite file in
    # the test's own directory, which needs an async driver for it.
    "aiosqlite>=0.20",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# Tests reach into what a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests; the extra path lets them import the support package.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002",
    # Errors compose their message from typed fields; the string at a raise site is a reason.
    "TRY003", "EM101", "EM102",
    # The package logs through the logging contract, whose context mapping
    # the standard library's format-argument checks misread:
    "PLE1205", "PLE1206",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests carry client secrets, codes and tokens as literals (S105/S106), annotate
# doubles loosely (ANN), and — in the served fixtures — keep the container-read
# annotations importable at runtime (TC001/TC002), the way the library does.
# They also build the driver and the managers with the flags the configuration
# holds, which are positional parameters there (FBT003), as the options are.
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "ARG",
    "FBT003",
    "PLR2004",
    "PLR0913",
    "SLF001",
    "D",
    "TC001",
    "TC002",
    "ANN001",
    "ANN202",
    "PT018",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # The audited base the application-client tests map on is reached through
    # advanced-alchemy, which still carries a decorator SQLAlchemy 2.1 retired;
    # it is raised when that package is imported, so no test can avoid it.
    "ignore:The declarative_mixin decorator:sqlalchemy.exc.SADeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
