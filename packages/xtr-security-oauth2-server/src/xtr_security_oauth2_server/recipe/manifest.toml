# The recipe for xtr-security-oauth2-server: what *Use in an application* in
# the README takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
# An add-on: no other bundle requires it, so it only ever arrives by being
# listed. It brings the security family, the clock, the event dispatcher and
# the HTTP kernel with it.
"xtr_security_oauth2_server.bundle:OAuth2ServerBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle builds and boots without it, but issues nothing until a
# deployment says who this server is, what it signs and seals with, which
# scopes it knows and where its clients live: this module says all four.
"config/oauth2_server.py" = "files/config/oauth2_server.py.tmpl"

[env]
# The file the written configuration reads the signing key from. A deployment
# mounts its own key and points this at it; a key is never minted for it.
OAUTH2_SERVER_PRIVATE_KEY_PATH = "%kernel.project_dir%/secrets/oauth2.pem"
# No default, so the variable is written commented out and stays unset: this
# carries the base64url of 32 random bytes, which only the deployment can
# choose. Until it is set, a request reports it by name.
OAUTH2_SERVER_ENCRYPTION_KEY = ""

[gitignore]
# A private key never enters the repository, wherever the key pair is written;
# nor does the public JWK set written beside it.
lines = ["/secrets/*.pem", "/secrets/*.jwks.json"]

[notes]
steps = [
  "Mint the signing key pair where OAUTH2_SERVER_PRIVATE_KEY_PATH points, and mount the deployment's own key in production. This package's own key-pair command is not shipped yet; until it is, write the pair with '<script> jwt:generate-keypair --kid oauth2 --output-dir secrets' or with the tooling the deployment already uses.",
  "Set OAUTH2_SERVER_ENCRYPTION_KEY to the base64url of 32 random bytes, which is what the written configuration's encryption_key_type='key' reads: python -c \"import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip('='))\".",
  "Change the issuer in config/oauth2_server.py to the origin clients reach this server at: every token claims it, and the description published under it names the endpoints.",
  "Include the router where the application is served — app.include_router(routes()) from xtr_security_oauth2_server.routes, at the root and under no prefix — and build the kernel with concurrent_scoped_access=True, calling setup(app, kernel), as the security family requires.",
  "Put an unbound Firewall() on the application itself, so the authorization endpoint establishes the resource owner; without one, /authorize is reached with nobody authenticated and answers access_denied. Which requests it claims is the firewall pattern's to decide, which is what keeps /token, /revoke, /introspect, /device-code and the .well-known paths outside it — authenticating the client there is this server's own job.",
  "Answer the consent question: a listener on OAuth2Events.AUTHORIZATION_REQUEST_RESOLVE either resolves the request or answers the browser with a page of its own, and binds the form it shows to the person it is shown to.",
  "Add OAuth2AuthenticatorConfig() to the authenticators of the firewall in front of the API, so the tokens this server issues are accepted there.",
  "Register a client before any flow can run; and when the store is swapped for OrmPersistenceConfig(), generate the revision with 'orm:migrations:diff' and apply it.",
]
check = [
  "<script> debug:bundles — oauth2_server is listed and active, security, clock, event_dispatcher and http_kernel required",
  "<script> debug:config oauth2_server — the resolved issuer, lifetimes, flows and store",
  "GET /.well-known/oauth-authorization-server — the description names this server's issuer and endpoints",
]
