[project]
name = "xtr-maker"
version = "5.2.1"
description = "Console commands that write application code for the xtr libraries: messages, schedules, webhooks, entities, commands and listeners."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["generator", "scaffolding", "code generation", "console", "templates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    "libcst>=1.4",
    "typing-extensions>=4.4",
    "xtr-console>=5.0,<6",
    "xtr-dependency-injection>=5.0,<6",
]

# Each maker writes code for one library, and is offered only when that library's bundle is
# active; an extra installs the library beside the makers.
[project.optional-dependencies]
event-dispatcher = ["xtr-event-dispatcher>=5.0,<6"]
messenger = ["xtr-messenger>=5.0,<6"]
orm = ["xtr-orm>=5.0,<6"]
scheduler = ["xtr-scheduler>=5.0,<6"]
webhook = ["xtr-webhook>=5.0,<6"]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
maker = "xtr_maker.bundle:MakerBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
maker = "xtr_maker.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    # Every peer a maker writes code for, so each maker's tests run against its library.
    "xtr-event-dispatcher>=5.0,<6",
    "xtr-messenger>=5.0,<6",
    # With its SQLite driver: the entity maker's tests store a row in a temporary database.
    "xtr-orm[sqlite]>=5.0,<6",
    "xtr-scheduler>=5.0,<6",
    "xtr-webhook>=5.0,<6",
    # The bundles make:schedule's --stateful and --lock need active.
    "xtr-cache>=5.0,<6",
    "xtr-lock>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# `@override` landed in typing in 3.12; on 3.11 we import from typing_extensions
# only when the class actually derives from a base with matching methods.
reportImplicitOverride = "none"
# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_maker/exception/.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "TC002",   # pytest is imported at runtime for markers even without type use
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # The tests that activate the orm bundle import its database layer, which still
    # decorates its mixins with a marker SQLAlchemy 2.1 deprecated; it warns once, on
    # import, and changes nothing. Matched by message alone: naming SQLAlchemy's category
    # would break the run where xtr-orm is not installed.
    "ignore:The declarative_mixin decorator",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 94
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
