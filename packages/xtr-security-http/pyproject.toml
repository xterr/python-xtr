[project]
name = "xtr-security-http"
version = "5.2.0"
description = "The HTTP edge of xtr security: firewalls, authenticators, bearer access tokens and the request surface."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["security", "authentication", "firewall", "fastapi", "oauth2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "xtr-security-core>=5.0,<6",
    "xtr-security-csrf>=5.0,<6",
    "xtr-http-kernel>=5.0,<6",
    "xtr-http-foundation>=5.0,<6",
    "xtr-http-message-contracts>=5.0,<6",
    # The client interface the introspection endpoint is reached through; the client
    # itself is installed by the application that introspects.
    "xtr-http-client-contracts>=5.0,<6",
    # The cache contract the introspection responses are cached under; the pool
    # behind it is the application's choice.
    "xtr-cache-contracts>=5.0,<6",
    "xtr-dependency-injection>=5.0,<6",
    "xtr-event-dispatcher>=5.0,<6",
    "xtr-event-dispatcher-contracts>=5.0,<6",
    "xtr-clock>=5.0,<6",
    "xtr-logging-contracts>=5.0,<6",
    "xtr-password-hasher>=5.0,<6",
    "xtr-rate-limiter>=5.0,<6",
    "fastapi>=0.123",
    "starlette>=0.40",
    "anyio>=4.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
oidc = [
    "joserfc>=1.7",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "joserfc>=1.7",
    # The tests match real requests, so they build the request messages.
    "xtr-http-message>=5.0,<6",
    # The tests drive the introspection endpoint through the scripted client and
    # cache the responses in the in-memory pool.
    "xtr-http-client>=5.0,<6",
    "xtr-cache>=5.0,<6",
    "xtr-console>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# The per-request state names the firewall context it records, the context
# names the manager that authenticates, and the manager interface takes the
# state its passes hand each other. The imports are TYPE_CHECKING-only, so no
# cycle exists at runtime — only in the static graph.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_security_http"
reportImportCycles = "none"

# Tests reach into what a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests; the extra path lets them import the support package.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002",
    # Errors compose their message from typed fields; the string at a raise site is a reason.
    "TRY003", "EM101", "EM102",
    # The package logs through the logging contract, whose context mapping
    # the standard library's format-argument checks misread:
    "PLE1205", "PLE1206",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
