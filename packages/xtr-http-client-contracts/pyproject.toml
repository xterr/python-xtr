[project]
name = "xtr-http-client-contracts"
version = "5.0.0"
description = "The async HTTP client contract alone: a request call, a response read on demand, typed options and the errors they raise."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["http", "http-client", "contracts", "interface", "protocol", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# `typing-extensions` for `@override` and `Unpack` on 3.11; the message contract,
# because a client response is an HTTP response before it is anything else.
dependencies = [
    "typing-extensions>=4.4",
    "xtr-http-message-contracts>=5.0,<6",
]

[project.optional-dependencies]
# What the conformance suite needs to run: an async backend to drive the
# fixture server, the runner its base class is written for, and a request
# implementation, because `send_request` takes a message request to send.
testing = [
    "anyio>=4.0",
    "pytest>=8",
    "xtr-http-message>=5.0,<6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "xtr-http-message>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# A connection's address comes out of the standard library's streams untyped.
# Scoped here only; every other module keeps this on.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_http_client_contracts/testing/_fixture_request.py"
reportAny = "none"

# So does the JSON a request body carries, which only `_json_fields` looks at.
# Scoped here only; every other module keeps this on.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_http_client_contracts/testing/_fixture_routes.py"
reportAny = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests. They also read sockets and JSON, both untyped.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
reportAny = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# A conformance suite is tests that happen to ship in `src`: it asserts, and the status codes and
# durations it asserts on are its subject matter.
"src/xtr_http_client_contracts/testing/http_client_test_case.py" = [
    "S101",    # assert is the point of a test
    "PLR2004", # a status code in an assertion is the assertion
]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # The conformance suite runs against a client, and this package ships none: its bodies
    # are exercised where a client implementation subclasses it, not here. Its shape is
    # checked by `tests/unit/testing/test_http_client_test_case.py`.
    "*/xtr_http_client_contracts/testing/http_client_test_case.py",
]

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
