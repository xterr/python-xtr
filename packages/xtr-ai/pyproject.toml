[project]
name = "xtr-ai"
version = "6.4.0"
description = "Named language-model platforms and agents built on pydantic-ai, with conversation stores and cross-process run control."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "llm", "agent", "pydantic-ai", "openai", "anthropic", "conversation", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.0",
    "pydantic-ai-slim>=2.66,<3",
    "typing-extensions>=4.12",
    "xtr-clock>=6.0,<7",
    "xtr-logging-contracts>=6.0,<7",
]

# The model providers are pydantic-ai's own extras, forwarded under the same names.
[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.66,<3"]
anthropic = ["pydantic-ai-slim[anthropic]>=2.66,<3"]
google = ["pydantic-ai-slim[google]>=2.66,<3"]
bedrock = ["pydantic-ai-slim[bedrock]>=2.66,<3"]
mistral = ["pydantic-ai-slim[mistral]>=2.66,<3"]
groq = ["pydantic-ai-slim[groq]>=2.66,<3"]
openrouter = ["pydantic-ai-slim[openrouter]>=2.66,<3"]
mcp = ["pydantic-ai-slim[mcp]>=2.66,<3"]
ag-ui = ["pydantic-ai-slim[ag-ui]>=2.66,<3"]
# Conversations and run control kept on an xtr-orm connection: the two bridges, which the
# bundle wires when they are installed.
orm = [
    "xtr-ai-orm-conversation-store>=6.0,<7",
    "xtr-ai-orm-run-control>=6.0,<7",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
ai = "xtr_ai.bundle:AiBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
ai = "xtr_ai.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ty>=0.0.83",
    # A real provider is built, never called, to check keys and closing.
    "pydantic-ai-slim[openai]>=2.66,<3",
    "xtr-dependency-injection>=6.0,<7",
    "xtr-console>=6.0,<7",
    "xtr-logging>=6.0,<7",
    "xtr-orm>=6.0,<7",
    "xtr-ai-orm-conversation-store>=6.0,<7",
    "xtr-ai-orm-run-control>=6.0,<7",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# pydantic-ai's agent, capability and toolset types are generic over the run's
# dependencies and output, which a configured agent only knows as Any.
reportExplicitAny = "none"
reportAny = "none"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields.
    "TRY003",
    "EM101",
    "EM102",
    # The logging contract's LoggerInterface takes a context mapping, not the standard
    # library's format arguments; PLE1205 reads one as the other.
    "PLE1205",
    # pydantic-ai's generic types are parameterised with Any where a configured
    # agent's dependencies and output are only known at run time.
    "ANN401",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the engine reads at
# runtime; deferring these imports would register the factories under nothing.
"src/xtr_ai/bundle/*.py" = ["TC001", "TC002", "TC003"]
# A command's parameters are read by the console at runtime.
"src/xtr_ai/command/*.py" = ["TC001", "TC002", "TC003"]
# The run-control contract is a test suite shipped for backends to run.
"src/xtr_ai/testing/run_control_contract.py" = [
    "S101",     # assert is the point of pytest
    "D102",     # test names are the docs
    "PLR2004",  # magic numbers in test data
    "SLF001",   # the checks drive a backend's storage primitives, as another process would
    "ASYNC110", # a cancellation token offers no event to wait on
]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "S603",    # a child interpreter is how a second process is checked
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # xtr-orm's database layer reaches advanced-alchemy, which still carries a decorator
    # SQLAlchemy 2.1 retired; it warns once, on import, and changes nothing.
    "ignore:The declarative_mixin decorator:sqlalchemy.exc.SADeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
