[project]
name = "xtr-orm-messenger"
version = "5.2.1"
description = "A database transport for xtr-messenger: messages kept in a table on an xtr-orm connection, claimed by workers, delayed, redelivered and woken by notifications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
keywords = ["message-bus", "message-queue", "transport", "database", "sqlalchemy", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18",
    "sqlalchemy[asyncio]>=2.0.41",
    "typing-extensions>=4.4",
    "xtr-clock>=5.0,<6",
    "xtr-messenger>=5.0,<6",
    "xtr-orm>=5.0,<6",
]

[project.optional-dependencies]
# Wakes a waiting worker the moment a message is sent, through the database's
# own notifications, instead of when its poll interval runs out.
postgres = [
    "xtr-orm[postgres]>=5.0,<6",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
orm_messenger = "xtr_orm_messenger.bundle:OrmMessengerBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
orm_messenger = "xtr_orm_messenger.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    # Every test runs on SQLite files under the test's own directory: no server.
    "aiosqlite>=0.20",
    "xtr-console>=5.0,<6",
    "xtr-dependency-injection>=5.0,<6",
    "xtr-recipes>=5.0,<6",
    # The envelope serializer the tests encode with is built on it, as the bundle's is.
    "xtr-serializer>=5.0,<6",
    "xtr-service-contracts>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Errors compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the container reads
# at runtime; deferring these would register the factories under nothing.
"src/xtr_orm_messenger/bundle/*.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",     # assert is the point of pytest
    "ARG",      # fixtures look unused
    "PLR2004",  # magic numbers in test data
    "SLF001",   # tests reach into privates
    "D",        # test names are the docs
    "FBT003",   # a flag passed positionally is test data
    "S608",     # SQL written by the test itself, against its own SQLite file
    "ASYNC240", # a test reads the revision file it had written, in place
    "PLR0913",  # fixtures arrive as arguments
    "PLR0917",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # The database layer xtr-orm builds on still decorates its mixins with a
    # marker SQLAlchemy 2.1 deprecated; it warns once, on import.
    "ignore:The declarative_mixin decorator:sqlalchemy.exc.SADeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
