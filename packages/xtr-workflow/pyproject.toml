[project]
name = "xtr-workflow"
version = "5.0.1"
description = "Move objects through workflows and state machines — weighted places and transitions, guards, events at every step, definitions in code, config or on a class, dumped as Graphviz, PlantUML or Mermaid."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["workflow", "state-machine", "petri-net", "transitions", "guards", "graphviz", "plantuml", "mermaid", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4",
    "xtr-clock>=5.0,<6",
    # The implementation too, not only the contracts: the workflow listener
    # decorators wrap its as_event_listener, the audit trail listener is an
    # EventSubscriberInterface, which only it defines, and listing a workflow's
    # listeners sees through the lazy and traced wrappers it puts around them.
    "xtr-event-dispatcher>=5.0,<6",
    "xtr-event-dispatcher-contracts>=5.0,<6",
    "xtr-logging-contracts>=5.0,<6",
    "xtr-service-contracts>=5.0,<6",
]

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
workflow = "xtr_workflow.bundle:WorkflowBundle"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "xtr-console>=5.0,<6",
    "xtr-dependency-injection>=5.0,<6",
    "xtr-logging>=5.0,<6",
    "xtr-security>=5.0,<6",
    "xtr-security-core>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# The transition errors name the workflow interface, which names definitions
# (built from arcs), markings and stores that raise those errors. The imports
# are TYPE_CHECKING-only, so the cycle exists only in the static graph, never
# at runtime.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_workflow/arc.py"
reportImportCycles = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_workflow/definition.py"
reportImportCycles = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_workflow/exception"
reportImportCycles = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages; the string at a raise site is the reason.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the container reads
# at runtime; deferring these would register the factories under nothing.
"src/xtr_workflow/bundle/*.py" = ["TC001", "TC002", "TC003"]
# A container builds these from their constructors' annotations, read at runtime.
"src/xtr_workflow/event_listener/*.py" = ["TC001", "TC002", "TC003"]
# xtr-console reads a command's annotations at runtime.
"src/xtr_workflow/command/*.py" = ["TC001", "TC002", "TC003"]
# Fixture applications are scanned by a container, which reads their
# annotations at runtime to build services and find what listeners hear.
"tests/fixtures/**/*.py" = ["TC001", "TC002", "TC003", "S101", "D"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Configuration dataclasses are introspected at runtime, so their field
# imports must stay out of TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 96
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    # An overload only states a signature for the type checker; the
    # implementation after it is what runs.
    "^\\s*@overload$",
]
