# The recipe for xtr-workflow: what *Use in an application* in the README
# takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
# It brings the event dispatcher bundle with it, and the logging and console
# bundles when their packages are installed. Never the security bundle, which
# brings an HTTP kernel along: guards need it listed, which [notes] asks for.
"xtr_workflow.bundle:WorkflowBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle's own defaults written out — no workflow — as the place the
# application's workflows are configured, with a commented starter one.
"config/packages/workflow.py" = "files/config/workflow.py.tmpl"

# No [env], no [keys], and nothing to ignore.

[gitignore]
lines = []

[notes]
steps = [
  "Configure the workflows in <app>/config/packages/workflow.py, or declare them on classes with @as_workflow: the bundle registers nothing until one of the two says a workflow.",
  "If a transition carries a guard, list SecurityBundle, from xtr_security.bundle, in <app>/config/bundles.py and follow the security bundle's own steps: it never comes along with the workflow bundle.",
  "An audit trail needs the event dispatcher and logging bundles active, and workflow:dump the console bundle: the event dispatcher bundle always comes along, the other two once xtr-logging and xtr-console are installed. A workflow needing a bundle that is not active fails the build naming it.",
]
check = [
  "<script> debug:bundles — workflow is listed and active",
  "<script> workflow:dump <name> — the definition the container built",
]
