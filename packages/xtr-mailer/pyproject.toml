[project]
name = "xtr-mailer"
version = "5.2.1"
description = "Send email through SMTP, sendmail or a provider's API — picked by DSN, in-process or queued on a message bus, with failover, round-robin, envelope and header overrides, DKIM and S/MIME signing."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mailer", "email", "smtp", "sendmail", "dsn", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4",
    # Speaks SMTP, to a mail server or to a local sendmail over its standard streams.
    "aiosmtplib>=5.1,<6",
    # The email a transport sends, and the bytes it renders to.
    "xtr-mime>=5.0,<6",
    # What throttling, an idle connection's ping and a dead transport's rest are measured with.
    "xtr-clock>=5.0,<6",
    # Listeners see every email before it goes, and hear whether it was sent or failed.
    "xtr-event-dispatcher-contracts>=5.0,<6",
    # The client interface provider transports talk through; the client itself is
    # installed by the application.
    "xtr-http-client-contracts>=5.0,<6",
    # Transports log through the logging interface; the application picks the logger.
    "xtr-logging-contracts>=5.0,<6",
    # The listener that keeps every email it saw is emptied when the container resets it.
    "xtr-service-contracts>=5.0,<6",
]

[project.optional-dependencies]
# Queue email on the message bus instead of sending it where it is made.
messenger = ["xtr-messenger>=5.0,<6"]
# Cap how often a transport sends, with a limiter named per transport.
rate-limiter = ["xtr-rate-limiter>=5.0,<6"]
# Send a test email from the command line.
console = ["xtr-console>=5.0,<6"]
# Sign outgoing email with DKIM.
dkim = ["xtr-mime[dkim]>=5.0,<6"]
# Sign and encrypt outgoing email with S/MIME.
smime = ["xtr-mime[smime]>=5.0,<6"]
# Wire the mailer from one configuration.
di = ["xtr-dependency-injection>=5.0,<6"]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "xtr-dependency-injection>=5.0,<6",
    # MockHttpClient stands in for the network in transport tests.
    "xtr-http-client>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_mailer/exception/.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions and handlers whose signatures the
# container reads at runtime; deferring these would register them under nothing.
"src/xtr_mailer/bundle/*.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
    "S105",    # fake secret literals are test data
    "S106",    # fake secret literals are test data
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Message dataclasses are read field by field at runtime, so the imports their
# annotations name must stay out of TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol body states a contract; there is nothing there to run.
    "^\\s*\\.\\.\\.$",
]
