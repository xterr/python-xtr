# The recipe for xtr-security-openid-connect-server: what *Use in an
# application* in the README takes, as data. Keep the two in step — the README
# is the source.

[bundles]
# "<module>:<Class>" = the environments it is listed with, exactly as in BUNDLES.
# An add-on: no other bundle requires it, so it only ever arrives by being
# listed. It brings the OAuth 2.0 authorization server with it, and with that
# the security family, the clock, the event dispatcher and the HTTP kernel.
"xtr_security_openid_connect_server.bundle:OpenIdConnectServerBundle" = { all = true }
