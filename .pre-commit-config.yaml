repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.9
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    # Audit the GitHub Actions workflows, dependabot.yml and this file for security issues.
    - id: zizmor
- repo: local
  hooks:
    # Run the test suite of every package with a staged file. CI runs them all.
    - id: pytest
      name: pytest (changed packages)
      language: system
      files: ^packages/
      require_serial: true
      entry: >-
        bash -c 'for p in $(printf "%s\n" "$@" | cut -d/ -f2 | sort -u); do
        [ -d "packages/$p/tests" ] || continue;
        uv run --frozen --package "$p" pytest -q --rootdir "packages/$p" "packages/$p" || exit 1;
        done' --
    # Every context variable a library declares is classified, and per-unit state is detached:
    # a package's own suite cannot see that, so it is checked whenever a library source changes.
    - id: context-vars
      name: context variables (classified, per-unit state detached)
      language: system
      files: ^(packages/[^/]+/src/.+\.py|tests/test_context_vars\.py)$
      pass_filenames: false
      entry: uv run --frozen pytest -q -p no:cacheprovider tests/test_context_vars.py
    # Every task a library starts says which context it runs in (lint/ast-grep/rules).
    - id: ast-grep
      name: ast-grep (task-without-context)
      language: system
      files: ^(packages/[^/]+/src/.+\.py|lint/ast-grep/.+|sgconfig\.yml)$
      pass_filenames: false
      entry: bash -c 'uv run --frozen ast-grep scan && uv run --frozen ast-grep test'