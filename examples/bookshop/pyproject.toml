[project]
name = "bookshop"
version = "5.0.1"
description = "A complete example application built on every xtr package: kernel, bundles, console, web, messenger, scheduler, database."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # The web entry point. Only an application takes a server; no library here does.
    "fastapi>=0.121.3",
    "uvicorn>=0.30",
    "xtr-cache",
    "xtr-cache-contracts",
    "xtr-clock",
    "xtr-console",
    "xtr-dependency-injection",
    "xtr-dotenv",
    "xtr-event-dispatcher",
    "xtr-event-dispatcher-contracts",
    "xtr-http-kernel",
    "xtr-lock",
    "xtr-logging",
    "xtr-logging-contracts",
    "xtr-messenger[pydantic,amqp]",
    # SQLite in dev and test, PostgreSQL in prod.
    "xtr-orm[sqlite,postgres]",
    # State in the cache pool, locked through the lock bundle; in prod, counted in Redis.
    "xtr-rate-limiter[redis]",
    "xtr-scheduler[cron]",
    "xtr-service-contracts",
    # Exported catalogue reports land in a named storage, on local files here.
    "xtr-storage",
    # Security: the family bundle wires core, the http edge and the password hasher; the jwt
    # add-on bundle rides on top. [console] adds debug:firewall, security:hash-password and the
    # jwt:* commands. The three family libraries are listed too, because the application imports
    # their public API directly — core for the voter, http for the route markers, the hasher for
    # the /token password check.
    "xtr-security",
    "xtr-security-core",
    "xtr-security-http",
    "xtr-security-jwt",
    "xtr-password-hasher",
    # Incoming webhooks: the payments provider posts here. The endpoint is a route
    # resource — config/routes/webhook.py is what registers it, and the consumer of
    # what it read runs on the bus, where a sender that times out never waits.
    "xtr-remote-event",
    "xtr-webhook",
]

[project.scripts]
bookshop = "bookshop.__main__:main"
bookshop-web = "bookshop.web.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "ty>=0.0.83",
    # demo:rate-limit drives the web application in process, the way a server would.
    "httpx>=0.27",
    # Applies each installed package's recipe — what its README's "Use in an
    # application" lists — and records it in xtr.lock. A tool, not a dependency.
    "xtr-recipes",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two top-level packages live under src/: the application, and a small library
# it ships alongside to show what a reusable package with its own bundle looks like.
module-name = ["bookshop", "fulltext"]

# This example is its own uv project, NOT a member of the repository's workspace:
# every xtr package is taken from the working tree, editable, so a change in
# packages/ is visible here at once.
[tool.uv.sources]
xtr-cache                = { path = "../../packages/xtr-cache", editable = true }
xtr-cache-contracts      = { path = "../../packages/xtr-cache-contracts", editable = true }
xtr-clock                = { path = "../../packages/xtr-clock", editable = true }
xtr-console              = { path = "../../packages/xtr-console", editable = true }
xtr-dependency-injection = { path = "../../packages/xtr-dependency-injection", editable = true }
xtr-dotenv               = { path = "../../packages/xtr-dotenv", editable = true }
xtr-event-dispatcher     = { path = "../../packages/xtr-event-dispatcher", editable = true }
xtr-event-dispatcher-contracts = { path = "../../packages/xtr-event-dispatcher-contracts", editable = true }
xtr-http-kernel          = { path = "../../packages/xtr-http-kernel", editable = true }
xtr-http-client-contracts = { path = "../../packages/xtr-http-client-contracts", editable = true }
xtr-http-foundation      = { path = "../../packages/xtr-http-foundation", editable = true }
xtr-http-message         = { path = "../../packages/xtr-http-message", editable = true }
xtr-http-message-contracts = { path = "../../packages/xtr-http-message-contracts", editable = true }
xtr-lock                 = { path = "../../packages/xtr-lock", editable = true }
xtr-logging              = { path = "../../packages/xtr-logging", editable = true }
xtr-logging-contracts    = { path = "../../packages/xtr-logging-contracts", editable = true }
xtr-messenger            = { path = "../../packages/xtr-messenger", editable = true }
xtr-orm                  = { path = "../../packages/xtr-orm", editable = true }
xtr-rate-limiter         = { path = "../../packages/xtr-rate-limiter", editable = true }
xtr-recipes              = { path = "../../packages/xtr-recipes", editable = true }
xtr-remote-event         = { path = "../../packages/xtr-remote-event", editable = true }
xtr-scheduler            = { path = "../../packages/xtr-scheduler", editable = true }
xtr-service-contracts    = { path = "../../packages/xtr-service-contracts", editable = true }
xtr-storage              = { path = "../../packages/xtr-storage", editable = true }
xtr-security             = { path = "../../packages/xtr-security", editable = true }
xtr-security-core        = { path = "../../packages/xtr-security-core", editable = true }
xtr-security-http        = { path = "../../packages/xtr-security-http", editable = true }
xtr-security-jwt         = { path = "../../packages/xtr-security-jwt", editable = true }
xtr-password-hasher      = { path = "../../packages/xtr-password-hasher", editable = true }
xtr-webhook              = { path = "../../packages/xtr-webhook", editable = true }

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp", "var"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
# An error message long enough to be useful has to wrap.
reportImplicitStringConcatenation = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
# Revisions are written by orm:migrations:diff and never edited by hand.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # The logger interface takes a context mapping as its second argument;
    # PLE1205 assumes every `logger.info(...)` is the standard library's.
    "PLE1205",
    # Errors compose their own messages from typed fields.
    "TRY003",
    "EM101",
    "EM102",
    # The container, the console and the messenger read constructor, factory, hook, command
    # and handler annotations at runtime: an import used only in an annotation is still
    # needed at runtime here, so none may move under TYPE_CHECKING.
    "TC001",
    "TC002",
    "TC003",
    # The logger interface has no `.exception()`: an exception is reported under
    # context["exception"] (EXCEPTION_KEY), whatever the level.
    "TRY400",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src"]
