version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: bump
    groups:
      actions:
        patterns: ["*"]
  # uv.lock: security updates only. A limit of 0 turns off routine version
  # updates, but security updates still follow this entry's settings.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: bump
