name: Release

# Pushing a tag X.Y.Z publishes every package at X.Y.Z to PyPI, then creates the
# X.Y.Z GitHub release here and in each read-only repository — once CI has
# passed on a push of the tagged commit to main, which it waits for.
#
# Each package is published from its own job and environment, pypi-<package>,
# which is what its PyPI trusted publisher names: PyPI allows only one pending
# publisher per repository, workflow and environment, so a shared environment
# could not create more than one new project.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: Wait for CI on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read # to find the CI runs of the tagged commit
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A tag pushed with its commit starts before CI on main has finished:
          # wait for it, up to half an hour. A commit CI never ran on main waits too.
          for _ in $(seq 90); do
            state=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --json status,conclusion --jq '
                if any(.[]; .conclusion == "success") then "success"
                elif length == 0 or any(.[]; .status != "completed") then "pending"
                else "failure" end')
            case "$state" in
              success) exit 0 ;;
              failure) echo "::error::CI failed on $SHA; nothing is released."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::no CI run passed on a push of $SHA to main; nothing is released."
          exit 1

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.build.outputs.packages }}
      repositories: ${{ steps.build.outputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: what gets published is built from the tagged commit alone.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: build
        run: |
          set -euo pipefail
          uv run scripts/release.py check "$GITHUB_REF_NAME"
          packages=$(uv run scripts/release.py packages)
          for package in $(jq -r '.[]' <<<"$packages"); do
            uv build --package "$package" --out-dir "dist/$package"
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "repositories=$(jq -r 'map("python-" + .) | join(",")' <<<"$packages")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write # to trade for a PyPI token through trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/${{ matrix.package }}/

  tag:
    name: Tag the read-only repositories
    needs: [build, publish]
    runs-on: ubuntu-latest
    # The app's private key lives only in this environment, open to release tags.
    environment: split
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Otherwise git sends this workflow's own token to github.com, ahead
          # of the app token in the push URL, and the push is refused.
          persist-credentials: false
      # Only the read-only repositories, and only what tagging and releasing there needs.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: xterr
          repositories: ${{ needs.build.outputs.repositories }}
          permission-contents: write
          permission-workflows: write
      - env:
          PACKAGES: ${{ needs.build.outputs.packages }}
          SPLIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          for package in $(jq -r '.[]' <<<"$PACKAGES"); do
            repo="xterr/python-${package}"
            sha=$(git subtree split --prefix="packages/$package" HEAD)
            git push "https://x-access-token:${SPLIT_TOKEN}@github.com/${repo}.git" "$sha:refs/tags/$GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" --repo "$repo" --verify-tag --latest \
              --title "$GITHUB_REF_NAME" \
              --notes "Released from https://github.com/xterr/python-xtr/tree/$GITHUB_REF_NAME — on PyPI as https://pypi.org/project/${package}/${GITHUB_REF_NAME}/"
          done

  github-release:
    name: Release on GitHub
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create this repository's release for the tag
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.build.outputs.packages }}
        run: |
          set -euo pipefail
          notes=$(jq -r --arg version "$GITHUB_REF_NAME" \
            '"Published to PyPI:\n\n" + (map("- [\(.) \($version)](https://pypi.org/project/\(.)/\($version)/)") | join("\n"))' \
            <<<"$PACKAGES")
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
